tokenizer:
  name_or_path: artifacts/models/Qwen3-1.7B
  local_files_only: true

split_seed: 42
split_key_prefix: "moiraiblock-post-seed42::"
output_dir: outputs/formal/qwen3_1.7b/runs/qwen3_1_7b_linear_cka_min_seed42/data
enabled_tasks:
  - math
  - multihop

counts:
  stage2_discovery:
    math: 200
    multihop: 200
    code: 500
  stage3_adapter_train: 1000
  stage3_adapter_val: 500
  probe_train: 200
  probe_val: 500
  stage4_final_eval: 10

task_count_overrides:
  code:
    stage3_adapter_train: 200
    stage3_adapter_val: 45
    probe_train: 100
    probe_val: 45

allowed_cross_stage_reuse:
  - [stage2_discovery, probe_train]

sources:
  gsm8k:
    dataset_name: gsm8k
    repo_id: openai/gsm8k
    subset: main
    local_path: artifacts/data/gsm8k_train
    revision: 740312add88f781978c0658806c59bc2815b9866
    official_split: train
    field_mapping:
      id: question
      question: question
      target: answer

  clutrr:
    dataset_name: clutrr
    repo_id: CLUTRR/v1
    subset: rob_train_clean_23_test_all_23
    local_path: artifacts/data/clutrr_v1_task_1_2
    revision: a8158d1fac10864c3424d53662fe63bf7d82dd87
    official_split: train
    expected_rows: 4054
    task_name: task_1.2
    split_urls:
      train: https://raw.githubusercontent.com/kliang5/CLUTRR_huggingface_dataset/main/rob_train_clean_23_test_all_23/train.csv
      validation: https://raw.githubusercontent.com/kliang5/CLUTRR_huggingface_dataset/main/rob_train_clean_23_test_all_23/validation.csv
      test: https://raw.githubusercontent.com/kliang5/CLUTRR_huggingface_dataset/main/rob_train_clean_23_test_all_23/test.csv
    field_mapping:
      id: id
      story: story
      query: query
      target: target_text

  hotpotqa:
    dataset_name: hotpotqa
    repo_id: hotpotqa/hotpot_qa
    subset: distractor
    local_path: ../data/pretraining/hotpotqa_train
    # This local snapshot is identified by its source dataset metadata hash;
    # no network fetch is permitted by the formal pipeline.
    revision: local-dataset-info-sha256-3f8162c114ccf70b984c692d9bc205d2f81507faa774fccdc4581ba5a62c4fad
    official_split: train
    expected_rows: 90447
    field_mapping:
      id: id
      question: question
      context: context
      target: answer

  svamp:
    dataset_name: svamp
    repo_id: arkilpatel/SVAMP
    subset: official
    source_url: https://raw.githubusercontent.com/arkilpatel/SVAMP/689d7ccac74b9983a2ac7cc3b264f441b99e7c53/SVAMP.json
    local_path: artifacts/data/svamp
    revision: 689d7ccac74b9983a2ac7cc3b264f441b99e7c53
    official_split: all
    expected_rows: 1000
    field_mapping:
      id: id
      question: question
      target: answer

  mbpp:
    dataset_name: mbpp
    repo_id: google-research-datasets/mbpp
    subset: full
    local_path: outputs/data/mbpp_full_preprocessed
    revision: 4bb6404fdc6cacfda99d4ac4205087b89d32030c
    official_split: train
    expected_rows: 374
    field_mapping:
      id: stable_id
      prompt: prompt
      target: target
      test_list: test_list
      test_setup_code: test_setup_code
      challenge_test_list: challenge_test_list

  math_train:
    dataset_name: math
    repo_id: EleutherAI/hendrycks_math
    subset: all_hendrycks_math_configs
    subsets:
      - algebra
      - counting_and_probability
      - geometry
      - intermediate_algebra
      - number_theory
      - prealgebra
      - precalculus
    local_path: artifacts/data/math_train
    revision: 21a5633873b6a120296cce3e2df9d5550074f4a3
    official_split: train
    expected_rows: 7500
    expected_columns: [problem, level, type, solution]
    source_reference: https://huggingface.co/datasets/EleutherAI/hendrycks_math
    field_mapping:
      question: problem
      target: solution

  openmathinstruct2:
    dataset_name: openmathinstruct2
    repo_id: nvidia/OpenMathInstruct-2
    subset: default
    data_file:
      - data/train_1M-00000-of-00003.parquet
      - data/train_1M-00001-of-00003.parquet
      - data/train_1M-00002-of-00003.parquet
    file_format: parquet
    local_path: artifacts/data/openmathinstruct2_train_1m
    revision: 469216e3f46f4dacf476b382e192485ea51a143e
    official_split: train_1M
    expected_rows: 1000000
    expected_columns: [problem, generated_solution, expected_answer, problem_source]
    source_reference: https://huggingface.co/datasets/nvidia/OpenMathInstruct-2
    field_mapping:
      question: problem
      target: generated_solution
      answer: expected_answer

  musique:
    dataset_name: musique
    repo_id: voidful/MuSiQue
    subset: default
    data_file: musique_full_v1.0_train.jsonl
    file_format: json
    local_path: artifacts/data/musique_train
    revision: a7d9f9adf6191604fc67cde318ee1a86fcf7babc
    official_split: train
    expected_rows: 39876
    expected_columns:
      - id
      - paragraphs
      - question
      - question_decomposition
      - answer
      - answer_aliases
      - answerable
    source_reference: https://github.com/StonyBrookNLP/musique
    field_mapping:
      id: id
      question: question
      context: paragraphs
      target: answer

  2wikimultihopqa:
    dataset_name: 2wikimultihopqa
    repo_id: xanhho/2WikiMultihopQA
    subset: default
    data_file: train.parquet
    file_format: parquet
    local_path: artifacts/data/2wikimultihopqa_train
    revision: 612bc5039a457880d9e7d84c3b0a4cf154b70e4f
    official_split: train
    expected_rows: 167454
    expected_columns: [_id, type, question, context, supporting_facts, evidences, answer]
    source_reference: https://github.com/Alab-NII/2wikimultihop
    field_mapping:
      id: _id
      question: question
      context: context
      target: answer

  xcoder_80k:
    dataset_name: xcoder_80k
    repo_id: banksy235/XCoder-80K
    subset: default
    data_file: data/train-00000-of-00001.parquet
    file_format: parquet
    local_path: artifacts/data/xcoder_80k_train
    revision: c3309ddc5001e9e53774b53474a594dbf5cb27cb
    official_split: train
    expected_rows: 80000
    expected_columns: [messages, id]
    source_reference: https://huggingface.co/datasets/banksy235/XCoder-80K
    field_mapping:
      id: id
      messages: messages

