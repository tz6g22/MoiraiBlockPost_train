seed: 42
model_mode: original_residual_only
formal_discovery: true
ordinary_residual_cost_defined: true
base_checkpoint: ${QWEN3_14B_PATH}
data_manifest: outputs/data/splits.json
data_config: configs/data.yaml
tasks: [math, multihop, code]
discovery_cases_per_task:
  math: 1000
  multihop: 1000
  code: 500
fixed_block_size: 4
num_blocks_policy: ceil_num_layers_over_fixed_block_size
min_block_length: 2
max_block_length: 6
no_adjacent_singletons: true
output_dir: outputs/formal/discovery_formal
